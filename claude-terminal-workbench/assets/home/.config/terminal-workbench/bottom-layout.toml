# Claude Cream monitor, updated every two seconds.
[flags]
rate = 2000
hide_time = true
default_widget_type = "proc"
[processes]
columns = ["PID", "Name", "CPU%", "Mem%"]
[[row]]
ratio = 3
[[row.child]]
type = "cpu"
[[row]]
ratio = 2
[[row.child]]
type = "mem"
[[row]]
ratio = 4
[[row.child]]
ratio = 2
[[row.child.child]]
type = "net"
[[row.child.child]]
type = "disk"
[[row.child]]
ratio = 3
type = "proc"
default = true

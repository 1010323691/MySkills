# Claude Workbench. Reloading is idempotent and does not restart sessions.
set -g default-terminal "tmux-256color"
set -s terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm-ghostty:RGB,xterm-256color:RGB'
set -g mouse on
set -g history-limit 100000
set -sg escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g set-clipboard external
set -g detach-on-destroy on
set -g destroy-unattached off
set -g default-shell /bin/bash
set -g default-command ""
set -g update-environment 'DISPLAY WAYLAND_DISPLAY XAUTHORITY DBUS_SESSION_BUS_ADDRESS SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID GHOSTTY_RESOURCES_DIR GHOSTTY_BIN_DIR GHOSTTY_SHELL_FEATURES COLORTERM'
set -g set-titles on
set -g set-titles-string '#S · #W'
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 35
set -g status-right-length 50
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '
source-file ~/.config/tmux/claude-colors.conf
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind r source-file ~/.tmux.conf \; display-message 'Workbench configuration reloaded'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind f display-popup -E -d "#{pane_current_path}" -w 85% -h 80% '~/.local/bin/terminal-files'
bind P previous-window
bind p display-popup -E -e "TERMINAL_CLIENT=#{client_name}" -w 80% -h 65% '~/.local/bin/terminal-project'
bind g run-shell -b '~/.local/bin/terminal-tool git #{q:pane_current_path} #{pane_id}'
bind m run-shell -b '~/.local/bin/terminal-tool monitor #{q:pane_current_path} #{pane_id}'
set-hook -g client-resized 'run-shell -b "~/.local/bin/terminal-layout #{q:session_id}"'
set-hook -g client-attached 'run-shell -b "~/.local/bin/terminal-layout #{q:session_id}"'

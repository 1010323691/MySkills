<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>雾灰 · Mist 最小使用示例</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="component.css"><script src="component.js" defer></script><style>body{margin:0;padding:50px 28px;background:#d9d9dc}main{max-width:480px;margin:auto;display:grid;gap:30px}.sample-row{display:flex;gap:24px;flex-wrap:wrap}.sample-card{padding:28px}</style></head><body class="mist"><main><div class="sample-row"><button type="button" class="mist-button " aria-pressed="false" data-toggle>按钮</button><button type="button" class="mist-icon-button" aria-label="收藏" aria-pressed="false" data-toggle><svg class="mist-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 3.7 13A5.5 5.5 0 0 1 12 5a5.5 5.5 0 0 1 8.3 8Z"/></svg></button><button type="button" role="switch" class="mist-switch" aria-label="电源" aria-checked="true" ><span data-switch-label>On</span><span class="mist-switch__knob"><svg class="mist-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9m-5-6a8 8 0 1 0 10 0"/></svg></span></button></div><article class="mist-card sample-card"><label class="mist-field">名称<input class="mist-input" type="text" placeholder="输入名称"></label></article><form class="mist-search" role="search" aria-label="示例搜索"><svg class="mist-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input class="mist-search__input" type="search" aria-label="搜索关键词" name="q" placeholder="搜索…"><button class="mist-icon-button" type="submit" aria-label="提交搜索"><svg class="mist-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg></button></form><p style="font-size:12px">表单原生提交；业务项目自行绑定 submit 事件。</p><a href="demo.html">返回完整组件库</a></main></body></html>
